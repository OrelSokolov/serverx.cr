name: serverx
version: 0.2.1
description: |
  nginx-style HTTP server for Crystal: one buffer per connection, offset-based
  HTTP/1.1 parser with zero per-request allocations in the transport,
  master/worker processes via SO_REUSEPORT, stock HTTP::Handler API on top
  (any Crystal framework plugs in). Timeouts, limits, chunked bodies,
  streaming uploads, graceful shutdown, TLS. Benchmarked against the stdlib
  HTTP::Server and nginx (scenario 400/410-serverx of the rails.cr cycle).
crystal: ">= 1.21.0"
